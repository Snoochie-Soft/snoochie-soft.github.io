<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portal Zoom - Snoochie Soft redesign 02</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--ink:#f2f3f7;--mut:#8c92a4;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}
body{font:400 17px/1.55 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
nav{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,4vw,44px);pointer-events:none}
nav>*{pointer-events:auto}
nav .logo{font:800 20px Syne;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}
nav .logo i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,#c9f23a,#5ec8ef,#b9a8ff,#ffc21a,#c9f23a)}
nav .r{display:flex;gap:10px}
nav .r a{font-size:13px;padding:9px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);background:rgba(10,10,14,.4);transition:.3s}
nav .r a:hover{background:#fff;color:#000}
.stage{position:relative;height:100vh;overflow:hidden;background:var(--bg)}
.glow{position:absolute;inset:0;transition:none;pointer-events:none}
.scene{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;padding:0 clamp(24px,7vw,120px);gap:3vw;will-change:transform,opacity;transform-origin:72% 52%}
.scene .t .no{font:500 13px Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--c)}
.scene h2{font:800 clamp(46px,7.4vw,120px)/.92 Syne;letter-spacing:-.04em;margin:14px 0 18px}
.scene .k{font-size:clamp(17px,1.5vw,22px);color:#cfd3df;max-width:30ch;margin-bottom:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chips span{font-size:12px;padding:7px 13px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c)}
.ic{display:flex;align-items:center;gap:14px}
.ic img{width:56px;border-radius:22%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dev{justify-self:center;position:relative;height:min(78vh,720px);aspect-ratio:9/19;border-radius:40px;border:9px solid #14161d;background:#14161d;box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 50px 120px rgba(0,0,0,.7),0 0 160px color-mix(in srgb,var(--c) 35%,transparent);overflow:hidden;transform:rotate(-4deg)}
.dev img{width:100%;height:100%;object-fit:cover}
.dev::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 30%);pointer-events:none}
.badge{height:50px;width:auto}
.intro{grid-template-columns:1.5fr .7fr!important}.intro h1{font:800 clamp(50px,8vw,140px)/.88 Syne;letter-spacing:-.05em}
.intro h1 span{display:block;overflow:hidden;padding-bottom:.06em}
.intro h1 span i{display:block;font-style:normal}
.intro h1 .g{background:linear-gradient(90deg,#c9f23a,#5ec8ef 40%,#b9a8ff 70%,#ffc21a);-webkit-background-clip:text;color:transparent}
.intro p{max-width:34ch;color:#b4b9c8;margin:26px 0 30px;font-size:clamp(17px,1.4vw,21px)}
.hint{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.hint b{width:1px;height:46px;background:linear-gradient(#fff,transparent);display:block;animation:dr 1.8s infinite}
@keyframes dr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.orb{position:relative;justify-self:center;width:min(30vw,440px);aspect-ratio:1}
.orb img{position:absolute;width:24%;border-radius:22%;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.rail{position:absolute;right:clamp(12px,2vw,28px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:30}
.rail button{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);padding:0;overflow:hidden;opacity:.45;transition:.4s var(--ease);cursor:pointer}
.rail button.on{opacity:1;transform:scale(1.3);border-color:#fff}
.rail img{width:100%}
.out{padding:clamp(70px,10vw,140px) clamp(16px,5vw,64px) 36px;background:#07080c}
.out h2{font:800 clamp(40px,7vw,110px)/.95 Syne;letter-spacing:-.04em;margin-bottom:50px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1200px}
.card{padding:32px;border-radius:26px;background:#10121a;border:1px solid rgba(255,255,255,.08);transition:.5s var(--ease)}
.card:hover{transform:translateY(-8px);background:#151826}
.card b{display:block;font:800 26px Syne;margin:60px 0 8px}
.card p{color:var(--mut)}
.card span{font:500 12px Inter;letter-spacing:.2em;color:#c9f23a}
.mail{display:block;margin-top:110px;font:800 clamp(26px,5.6vw,92px)/1 Syne;letter-spacing:-.04em;background:linear-gradient(90deg,#c9f23a,#5ec8ef,#b9a8ff);-webkit-background-clip:text;color:transparent;word-break:break-all}
.meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:60px;color:var(--mut);font-size:14px}
@media(max-width:820px){.scene{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding-top:90px;align-items:start;gap:10px;transform-origin:50% 62%}.dev{height:42vh;justify-self:center;align-self:start}.scene h2{font-size:42px}.scene .k{display:none}.cards{grid-template-columns:1fr}.rail{display:none}nav .r a:not(:last-child){display:none}.orb{width:70vw}}
</style>
</head>
<body>
<nav><a class="logo" href="#"><i></i>Snoochie Soft</a><div class="r"><a href="#out">House rules</a><a href="#contact">Contact</a><a href="#">EN</a></div></nav>

<section class="stage" id="stage">
  <div class="glow" id="glow"></div>
  <div class="rail" id="rail"></div>
</section>

<section class="out" id="out">
  <h2>Three promises.<br>Every release.</h2>
  <div class="cards" id="cards"></div>
  <a class="mail" id="contact"></a>
  <div class="meta"><span>© 2026 Snoochie Soft · Bydgoszcz, Poland</span><span>Privacy · Terms · Support</span></div>
</section>

<script src="../vendor/gsap.min.js"></script><script src="../vendor/ScrollTrigger.min.js"></script><script src="../vendor/lenis.min.js"></script>
<script src="../shared/apps.js"></script><script src="../shared/common.js"></script>
<script>
const stage=document.getElementById('stage');
/* intro scene: orbiting app icons */
const orbPos=[[10,8],[62,2],[74,40],[58,74],[8,66],[30,36],[40,12]];
const scenes=[];
const intro=el(`<div class="scene intro" style="--c:#c9f23a;transform-origin:70% 50%"><div class="t"><h1><span><i>Small apps,</i></span><span><i class="g">made properly.</i></span></h1><p>An independent Android studio. Seven apps on Google Play. No accounts, nothing to sign up for.</p><div class="hint"><b></b>Scroll to dive in</div></div><div class="orb">${APPS.map((a,i)=>`<img src="${a.icon}" alt="" style="left:${orbPos[i][0]}%;top:${orbPos[i][1]}%">`).join('')}</div></div>`);
stage.appendChild(intro);scenes.push(intro);
APPS.forEach(a=>{
  const s=el(`<div class="scene" style="--c:${a.c1}"><div class="t"><div class="no">${a.no} · ${a.cat}</div><h2>${a.name}</h2><p class="k">${a.kind}. ${a.line}</p><div class="chips">${a.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="ic"><a href="${a.play}">${badge()}</a><img src="${a.icon}" alt=""></div></div><div class="dev"><img src="${a.shots[0]}" alt=""></div></div>`);
  s.style.opacity=0;stage.appendChild(s);scenes.push(s);
});
const rail=document.getElementById('rail');
APPS.forEach((a,i)=>{const b=el(`<button aria-label="${a.name}"><img src="${a.icon}" alt=""></button>`);b.onclick=()=>{const st=ScrollTrigger.getAll()[0];const y=st.start+(st.end-st.start)*((i+1)/APPS.length);(window.__l?__l.scrollTo(y):scrollTo(0,y))};rail.appendChild(b)});
const bgs=['#07080c',...APPS.map(a=>a.c1)];
document.getElementById('cards').innerHTML=RULES.map((r,i)=>`<div class="card"><span>0${i+1}</span><b>${r[0]}</b><p>${r[1]}</p></div>`).join('');
const m=document.getElementById('contact');m.textContent=EMAIL;m.href='mailto:'+EMAIL;

window.__l=initSmooth();
if(!RM){
  const N=scenes.length,tl=gsap.timeline({defaults:{ease:'none'},scrollTrigger:{trigger:stage,start:'top top',end:()=>'+='+(innerHeight*(N-1)*1.1),pin:true,scrub:.8,anticipatePin:1,
    onUpdate:self=>{const i=Math.min(APPS.length-1,Math.max(0,Math.round(self.progress*(N-1))-1));rail.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i&&self.progress>.04))}}});
  tl.set(scenes[0],{opacity:1},0);
  for(let i=0;i<N-1;i++){
    const a=scenes[i],b=scenes[i+1];
    tl.to(a,{scale:i===0?7:5,opacity:0,filter:'blur(14px)',duration:1,ease:'power3.in'},i)
      .fromTo(b,{scale:.45,opacity:0,filter:'blur(10px)'},{scale:1,opacity:1,filter:'blur(0px)',duration:1,ease:'power3.out'},i+.0)
      .to('#glow',{background:`radial-gradient(60% 70% at 70% 50%,${bgs[i+1]}38,transparent 70%)`,duration:1},i);
    if(b.querySelector('.dev'))tl.fromTo(b.querySelector('.dev'),{rotate:-14,y:80},{rotate:-4,y:0,duration:1},i);
  }
  /* idle floating icons on intro */
  gsap.utils.toArray('.orb img').forEach((im,i)=>gsap.to(im,{y:i%2?-22:22,x:i%3?14:-14,rotate:i%2?6:-6,duration:3+i*.4,ease:'sine.inOut',yoyo:true,repeat:-1}));
  gsap.from('.intro h1 i',{yPercent:110,duration:1.3,ease:'expo.out',stagger:.12,delay:.2});
  gsap.from('.orb img',{scale:0,opacity:0,duration:1.2,ease:'back.out(1.6)',stagger:.08,delay:.5});
  gsap.from('.card',{y:70,opacity:0,duration:1,ease:'expo.out',stagger:.1,scrollTrigger:{trigger:'.cards',start:'top 85%'}});
}else{scenes.forEach((s,i)=>{s.style.position='relative';s.style.opacity=1;s.style.minHeight='100vh'});}
</script>
</body>
</html>
