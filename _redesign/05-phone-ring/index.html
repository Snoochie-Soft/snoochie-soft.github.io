<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Phone Ring - Snoochie Soft redesign 05</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090d;--ink:#f3f4f8;--mut:#8b91a3;--c:#c9f23a;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}
body{font:400 17px/1.55 Outfit,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
nav{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,4vw,44px)}
nav .logo{font:800 20px Outfit;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}
nav .logo i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent);transition:background .6s}
nav .r{display:flex;gap:6px;padding:5px;border-radius:99px;background:rgba(255,255,255,.06);backdrop-filter:blur(12px)}
nav .r a{padding:8px 16px;border-radius:99px;font-size:14px;color:#c4c8d6}
nav .r a:hover{background:#fff;color:#000}
.stage{position:relative;height:100vh;overflow:hidden;isolation:isolate}
.bgc{position:absolute;inset:0;z-index:-3;background:radial-gradient(70% 60% at 50% 55%,color-mix(in srgb,var(--c) 42%,#08090d) 0,#08090d 72%);transition:background .8s}
.name{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;font:900 clamp(90px,21vw,360px)/.8 Outfit;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--c) 70%,#fff0);white-space:nowrap;z-index:-2;overflow:hidden;opacity:.9}
.name span{display:inline-block}
.head{position:absolute;left:clamp(16px,4vw,44px);top:96px;z-index:5;max-width:420px}
.head h1{font:800 clamp(30px,3.6vw,54px)/1 Outfit;letter-spacing:-.04em}
.head h1 span{color:var(--mut);font-weight:300}
.scene3d{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 40%;display:grid;place-items:center;padding-bottom:150px}
.ring{position:relative;width:0;height:0;transform-style:preserve-3d}
.ph{position:absolute;left:0;top:0;width:var(--w);aspect-ratio:9/19;margin:calc(var(--w)*-.527) 0 0 calc(var(--w)*-.5);border-radius:calc(var(--w)*.13);border:7px solid #15161c;background:#15161c;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.16),0 40px 90px rgba(0,0,0,.7);transform-style:preserve-3d;cursor:pointer;backface-visibility:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 35%);pointer-events:none}
.floor{position:absolute;left:50%;bottom:6%;width:min(70vw,900px);height:90px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 55%,transparent),transparent);filter:blur(14px);z-index:-1;transition:background .8s}
.info{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 clamp(16px,4vw,44px) 26px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:20px}
.info .a{max-width:40ch}
.info .no{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--c);font-weight:500;transition:color .6s}
.info h2{font:800 clamp(24px,2.6vw,40px)/1.05 Outfit;letter-spacing:-.03em;margin:4px 0 4px}
.info p{color:#b8bdcc;font-size:16px}
.dots{display:flex;gap:8px;align-items:center}
.dots button{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:0;overflow:hidden;opacity:.5;cursor:pointer;transition:.4s var(--ease)}
.dots button.on{opacity:1;transform:translateY(-8px) scale(1.2);border-color:#fff}
.dots img{width:100%}
.info .b{justify-self:end;display:flex;gap:14px;align-items:center}
.badge{height:50px;width:auto}
.hint{position:absolute;top:50%;right:clamp(16px,3vw,40px);writing-mode:vertical-rl;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);z-index:5}
.sec{padding:clamp(80px,10vw,150px) clamp(16px,4vw,44px)}
.sec h2{font:900 clamp(44px,8vw,130px)/.9 Outfit;letter-spacing:-.05em;margin-bottom:50px}
.sec h2 span{color:var(--mut);font-weight:300}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g3 div{padding:34px;border-radius:30px;background:#10121a;border:1px solid rgba(255,255,255,.07);transition:.5s var(--ease)}
.g3 div:hover{transform:translateY(-8px);background:#171a26}
.g3 b{display:block;font:800 28px Outfit;margin:70px 0 6px;letter-spacing:-.02em}
.g3 p{color:var(--mut)}
.g3 i{font:500 13px Outfit;font-style:normal;letter-spacing:.2em;color:var(--c)}
footer{padding:20px clamp(16px,4vw,44px) 34px}
footer .mail{display:block;font:900 clamp(28px,6.6vw,110px)/1 Outfit;letter-spacing:-.05em;word-break:break-all}
footer .meta{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:60px;color:var(--mut);font-size:14px}
@media(max-width:820px){.info{grid-template-columns:1fr;gap:12px;padding-bottom:16px}.info .b{justify-self:start}.dots{display:none}.g3{grid-template-columns:1fr}nav .r a:not(:last-child){display:none}.hint{display:none}.head{top:84px}.scene3d{padding-bottom:150px}}
</style>
</head>
<body>
<nav><a class="logo" href="#"><i></i>Snoochie Soft</a><div class="r"><a href="#rules">House rules</a><a href="#contact">Contact</a><a href="#">EN</a></div></nav>

<section class="stage" id="stage">
  <div class="bgc"></div>
  <div class="name" id="name"></div>
  <div class="head"><h1>Small apps, <span>made properly.</span></h1></div>
  <div class="scene3d"><div class="ring" id="ring"></div></div>
  <div class="floor"></div>
  <div class="hint">Scroll to spin</div>
  <div class="info"><div class="a" id="ia"></div><div class="dots" id="dots"></div><div class="b" id="ib"></div></div>
</section>

<section class="sec" id="rules"><h2>House <span>rules</span></h2><div class="g3" id="g3"></div></section>
<footer id="contact"><p style="color:var(--mut);margin-bottom:16px">Contact</p><a class="mail" id="mail"></a>
<div class="meta"><span>© 2026 Snoochie Soft · Bydgoszcz, Poland</span><span>Privacy · Terms · Support</span></div></footer>

<script src="../vendor/gsap.min.js"></script><script src="../vendor/ScrollTrigger.min.js"></script><script src="../vendor/lenis.min.js"></script>
<script src="../shared/apps.js"></script><script src="../shared/common.js"></script>
<script>
const N=APPS.length,step=360/N,stage=document.getElementById('stage'),ring=document.getElementById('ring');
const W=Math.round(Math.min(innerWidth*.21,Math.max(140,innerHeight*.34),280));
stage.style.setProperty('--w',W+'px');
const R=Math.round((W/2)/Math.tan(Math.PI/N)*1.35);
const phs=APPS.map((a,i)=>{const p=el(`<div class="ph" data-i="${i}">${a.shots.map((s,k)=>`<img src="${s}" alt="" style="opacity:${k?0:1}">`).join('')}</div>`);p.style.transform=`rotateY(${i*step}deg) translateZ(${R}px)`;ring.appendChild(p);return p});
const dots=document.getElementById('dots');
APPS.forEach((a,i)=>{const b=el(`<button aria-label="${a.name}"><img src="${a.icon}" alt=""></button>`);b.onclick=()=>goTo(i);dots.appendChild(b)});
document.getElementById('g3').innerHTML=RULES.map((r,i)=>`<div><i>0${i+1}</i><b>${r[0]}</b><p>${r[1]}</p></div>`).join('');
const m=document.getElementById('mail');m.textContent=EMAIL;m.href='mailto:'+EMAIL;

let cur=-1,shotT=null;
function activate(i){if(i===cur)return;cur=i;const a=APPS[i];
  stage.style.setProperty('--c',a.c1);document.documentElement.style.setProperty('--c',a.c1);
  document.getElementById('name').innerHTML='<span>'+a.short+'</span>';
  document.getElementById('ia').innerHTML=`<div class="no">${a.no} · ${a.cat}</div><h2>${a.name}</h2><p>${a.kind}. ${a.line}</p>`;
  document.getElementById('ib').innerHTML=`<a href="${a.play}">${badge()}</a>`;
  dots.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));
  if(!RM){gsap.fromTo('#name span',{yPercent:30,opacity:0},{yPercent:0,opacity:1,duration:.9,ease:'expo.out'});gsap.from('#ia>*,#ib',{y:20,opacity:0,duration:.7,ease:'expo.out',stagger:.06})}
  clearInterval(shotT);let k=0;const imgs=phs[i].querySelectorAll('img');shotT=setInterval(()=>{imgs[k].style.opacity=0;k=(k+1)%imgs.length;imgs[k].style.opacity=1},2300);
}
let ang=0,sway=0;
function render(){
  ring.style.transform=`translateZ(${-R}px) rotateX(-5deg) rotateY(${ang+sway}deg)`;
  const idx=((Math.round(-ang/step)%N)+N)%N;activate(idx);
  phs.forEach((p,i)=>{const d=((((i*step+ang)%360)+540)%360)-180,c=Math.cos(d*Math.PI/180);p.style.opacity=.3+.7*(c+1)/2;p.style.filter=`brightness(${.45+.55*(c+1)/2})`});
}
const total=()=>innerHeight*(N-1)*.9;
function goTo(i){const y=stage.offsetTop+total()*i/(N-1);window.__l?__l.scrollTo(y,{duration:1.4}):scrollTo({top:y,behavior:'smooth'})}
phs.forEach(p=>p.addEventListener('click',()=>goTo(+p.dataset.i)));
window.__l=initSmooth();
if(!RM){
  const o={a:0};
  ScrollTrigger.create({trigger:stage,start:'top top',end:()=>'+='+total(),pin:true,scrub:1,onUpdate:s=>{gsap.to(o,{a:s.progress*(N-1)*step*-1,duration:.9,ease:'power3.out',overwrite:true,onUpdate:()=>{ang=o.a;render()}})}});
  gsap.to({},{duration:6,repeat:-1,onUpdate(){sway=Math.sin(performance.now()/1800)*3;render()}});
  gsap.from(ring,{scale:.3,rotateZ:20,opacity:0,duration:1.6,ease:'expo.out'});
  gsap.from('.head h1',{y:40,opacity:0,duration:1.2,ease:'expo.out',delay:.3});
  gsap.from('.g3 div',{y:70,opacity:0,duration:1,ease:'expo.out',stagger:.1,scrollTrigger:{trigger:'.g3',start:'top 85%'}});
  gsap.from('.sec h2',{y:60,opacity:0,duration:1.1,ease:'expo.out',scrollTrigger:{trigger:'.sec',start:'top 80%'}});
  gsap.from('.mail',{yPercent:50,opacity:0,duration:1.2,ease:'expo.out',scrollTrigger:{trigger:'footer',start:'top 85%'}});
}
render();
</script>
</body>
</html>
