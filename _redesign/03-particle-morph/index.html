<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Particle Morph - Snoochie Soft redesign 03</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--ink:#ecedf2;--mut:#7d8394;--ac:#c9f23a;--line:rgba(255,255,255,.1);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}
body{font:400 17px/1.55 'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,4vw,44px)}
nav .logo{font:700 19px 'Space Grotesk';letter-spacing:-.02em}
nav .r{display:flex;gap:26px;color:var(--mut)}
nav .r a:hover{color:var(--ink)}
.stage{position:relative;height:100vh;overflow:hidden}
#pc{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;inset:0;padding:100px clamp(16px,4vw,44px) 36px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);pointer-events:none}
.hud>*{pointer-events:auto}
.l{display:flex;flex-direction:column;justify-content:space-between;max-width:560px}
.l h1{font:500 clamp(34px,4.6vw,70px)/1 'Space Grotesk';letter-spacing:-.04em}
.l h1 span{color:var(--mut)}
.info{min-height:230px}
.info .n{color:var(--ac);margin-bottom:10px}
.info h2{font:700 clamp(30px,3.4vw,52px)/1 'Space Grotesk';letter-spacing:-.04em;margin-bottom:10px}
.info p{color:#b5bac8;max-width:38ch;margin-bottom:20px}
.info .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badge{height:48px;width:auto}
.tag{padding:6px 11px;border:1px solid var(--line);border-radius:6px;color:var(--mut)}
.list{position:absolute;right:clamp(16px,4vw,44px);bottom:36px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.list button{background:none;border:0;color:var(--mut);font:500 15px 'Space Grotesk';display:flex;gap:14px;align-items:center;padding:5px 0;cursor:pointer;transition:.35s var(--ease)}
.list button i{font:400 11px 'JetBrains Mono';font-style:normal;opacity:.7}
.list button:hover,.list button.on{color:var(--ink);transform:translateX(-10px)}
.list button.on{color:var(--ac)}
.list button.on::after{content:"";width:34px;height:1px;background:var(--ac)}
.prog{position:absolute;left:clamp(16px,4vw,44px);right:clamp(16px,4vw,44px);bottom:20px;height:1px;background:var(--line)}
.prog b{display:block;height:100%;width:0;background:var(--ac)}
.cat{padding:clamp(80px,10vw,150px) clamp(16px,4vw,44px) 40px}
.cat h2{font:500 clamp(40px,6vw,96px)/1 'Space Grotesk';letter-spacing:-.05em;margin-bottom:50px}
.cat h2 span{color:var(--mut)}
.tr{display:grid;grid-template-columns:90px 1.2fr 1.4fr 1fr 60px;gap:20px;align-items:center;padding:26px 0;border-top:1px solid var(--line);position:relative;transition:padding .5s var(--ease),background .4s}
.tr:last-child{border-bottom:1px solid var(--line)}
.tr:hover{padding-left:20px;background:linear-gradient(90deg,rgba(255,255,255,.04),transparent)}
.tr .nm{font:700 clamp(22px,2.4vw,36px)/1.05 'Space Grotesk';letter-spacing:-.03em;display:flex;gap:14px;align-items:center}
.tr .nm img{width:44px;border-radius:22%}
.tr .d{color:var(--mut)}
.tr .a{justify-self:end;transition:transform .5s var(--ease)}
.tr:hover .a{transform:translate(6px,-6px);color:var(--ac)}
#pv{position:fixed;z-index:40;width:190px;aspect-ratio:9/19;border-radius:24px;border:5px solid #15161c;overflow:hidden;pointer-events:none;opacity:0;box-shadow:0 30px 80px rgba(0,0,0,.7);transform:translate(-50%,-50%) rotate(-5deg)}
#pv img{width:100%;height:100%;object-fit:cover}
.rules{padding:40px clamp(16px,4vw,44px) 100px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin:0 clamp(16px,4vw,44px);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rules div{background:var(--bg);padding:34px 30px 50px}
.rules b{display:block;font:700 26px 'Space Grotesk';letter-spacing:-.03em;margin:46px 0 6px}
.rules p{color:var(--mut)}
footer{padding:100px clamp(16px,4vw,44px) 30px}
footer .mail{font:500 clamp(28px,6.4vw,104px)/1 'Space Grotesk';letter-spacing:-.05em;display:block;word-break:break-all}
footer .mail:hover{color:var(--ac)}
footer .meta{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:70px;color:var(--mut);font-size:14px}
@media(max-width:820px){.hud{grid-template-columns:1fr;padding-top:84px}.l{max-width:none}.list{display:none}nav .r{display:none}.tr{grid-template-columns:60px 1fr 40px}.tr .d,.tr .kd{display:none}.rules{grid-template-columns:1fr;margin:0 16px}.info{min-height:0}}
</style>
</head>
<body>
<nav><a class="logo" href="#">Snoochie Soft</a><div class="r mono"><a href="#cat">Catalogue</a><a href="#rules">House rules</a><a href="#contact">Contact</a><span>EN</span></div></nav>

<section class="stage" id="stage">
  <canvas id="pc"></canvas>
  <div class="hud">
    <div class="l">
      <h1>Small apps,<br><span>made properly.</span></h1>
      <div class="info" id="info"></div>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="prog"><b id="prog"></b></div>
</section>

<section class="cat" id="cat">
  <h2>The catalogue <span>/ 07</span></h2>
  <div id="rows"></div>
</section>
<div id="pv"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div>

<div class="rules" id="rules"></div>
<footer id="contact"><p class="mono" style="color:var(--mut);margin-bottom:20px">Contact</p><a class="mail" id="mail"></a>
<div class="meta"><span>© 2026 Snoochie Soft · Bydgoszcz, Poland</span><span>Privacy · Terms · Support</span></div></footer>

<script src="../vendor/gsap.min.js"></script><script src="../vendor/ScrollTrigger.min.js"></script><script src="../vendor/lenis.min.js"></script>
<script src="../shared/apps.js"></script><script src="../shared/common.js"></script>
<script>
/* ---- UI ---- */
const list=document.getElementById('list'),info=document.getElementById('info');
APPS.forEach((a,i)=>list.appendChild(el(`<button data-i="${i}"><i>${a.no}</i>${a.name}</button>`)));
document.getElementById('rows').innerHTML=APPS.map(a=>`<a class="tr" href="${a.play}" data-shot="${a.shots[0]}"><span class="mono" style="color:var(--mut)">${a.no}</span><span class="nm"><img src="${a.icon}" alt="">${a.name}</span><span class="d">${a.line}</span><span class="mono kd" style="color:var(--mut)">${a.cat}</span><span class="a">↗</span></a>`).join('');
document.getElementById('rules').innerHTML=RULES.map((r,i)=>`<div><span class="mono" style="color:var(--ac)">0${i+1}</span><b>${r[0]}</b><p>${r[1]}</p></div>`).join('');
const m=document.getElementById('mail');m.textContent=EMAIL;m.href='mailto:'+EMAIL;
function showInfo(i){const a=APPS[i];
  list.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));
  info.innerHTML=`<div class="n mono">${a.no} · ${a.cat}</div><h2>${a.name}</h2><p>${a.kind}. ${a.line}</p><div class="row"><a href="${a.play}">${badge()}</a>${a.tags.map(t=>`<span class="tag mono">${t}</span>`).join('')}</div>`;
  if(!RM)gsap.from(info.children,{y:24,opacity:0,duration:.8,ease:'expo.out',stagger:.07});}

/* ---- particles ---- */
const cv=document.getElementById('pc'),cx=cv.getContext('2d');let W,H,D=Math.min(devicePixelRatio,2),mouse={x:-999,y:-999};
const N=innerWidth<700?2600:6400,P={x:new Float32Array(N),y:new Float32Array(N),vx:new Float32Array(N),vy:new Float32Array(N),tx:new Float32Array(N),ty:new Float32Array(N),col:new Array(N).fill('#fff'),s:new Float32Array(N)};
function rs(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);cx.fillStyle='#050507';cx.fillRect(0,0,W,H);if(clouds.length)setTarget(cur,true)}
addEventListener('resize',()=>rs());
cv.parentElement.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});
const clouds=[];let cur=0;
function sample(img){const S=110,o=document.createElement('canvas');o.width=o.height=S;const c=o.getContext('2d');c.drawImage(img,0,0,S,S);const d=c.getImageData(0,0,S,S).data,pts=[];
  for(let y=0;y<S;y+=1)for(let x=0;x<S;x+=1){const k=(y*S+x)*4;if(d[k+3]>200){pts.push([x/S-.5,y/S-.5,`rgb(${Math.min(255,d[k]*1.35+20)|0},${Math.min(255,d[k+1]*1.35+20)|0},${Math.min(255,d[k+2]*1.35+20)|0})`])}}
  for(let i=pts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]]}return pts}
function setTarget(i,quiet){cur=i;const pts=clouds[i],sz=Math.min(W*.36,H*.54,470),ox=W>820?W*.66:W*.5,oy=W>820?H*.44:H*.62;
  for(let k=0;k<N;k++){const p=pts[k%pts.length];P.tx[k]=ox+p[0]*sz;P.ty[k]=oy+p[1]*sz;P.col[k]=p[2];if(!quiet){const a=Math.random()*6.28,f=6+Math.random()*26;P.vx[k]+=Math.cos(a)*f;P.vy[k]+=Math.sin(a)*f}}
  if(!quiet)showInfo(i)}
let t0=performance.now();
function frame(t){const dt=Math.min((t-t0)/16.7,3);t0=t;
  cx.fillStyle='rgba(5,5,7,.22)';cx.fillRect(0,0,W,H);
  for(let k=0;k<N;k++){
    let dx=P.tx[k]-P.x[k],dy=P.ty[k]-P.y[k];
    P.vx[k]=(P.vx[k]+dx*.012*dt)*.9;P.vy[k]=(P.vy[k]+dy*.012*dt)*.9;
    const mx=P.x[k]-mouse.x,my=P.y[k]-mouse.y,md=mx*mx+my*my;if(md<14400){const f=(1-md/14400)*3.2;P.vx[k]+=mx*f*.02;P.vy[k]+=my*f*.02}
    P.vx[k]+=Math.sin(t*.001+k)*.02;P.vy[k]+=Math.cos(t*.0012+k*1.3)*.02;
    P.x[k]+=P.vx[k]*dt;P.y[k]+=P.vy[k]*dt;
    cx.fillStyle=P.col[k];cx.fillRect(P.x[k],P.y[k],2.8,2.8)}
  requestAnimationFrame(frame)}
function init(){rs();
  for(let k=0;k<N;k++){P.x[k]=W*.7+(Math.random()-.5)*W;P.y[k]=H*.5+(Math.random()-.5)*H}
  setTarget(0);requestAnimationFrame(frame)}
Promise.all(APPS.map(a=>new Promise(r=>{const im=new Image();im.onload=()=>{clouds[APPS.indexOf(a)]=sample(im);r()};im.src=a.icon}))).then(init);

list.addEventListener('click',e=>{const b=e.target.closest('button');if(b){auto=false;setTarget(+b.dataset.i)}});
let auto=true;setInterval(()=>{if(auto&&clouds.length)setTarget((cur+1)%APPS.length)},3800);

/* hover preview in the catalogue */
const pv=document.getElementById('pv'),pvi=pv.querySelector('img');
document.querySelectorAll('.tr').forEach(r=>{
  r.addEventListener('mouseenter',()=>{pvi.src=r.dataset.shot;gsap.to(pv,{opacity:1,scale:1,duration:.4})});
  r.addEventListener('mouseleave',()=>gsap.to(pv,{opacity:0,duration:.3}));
});
addEventListener('mousemove',e=>gsap.to(pv,{left:e.clientX+150,top:e.clientY,duration:.5,ease:'power3.out'}));

/* scroll: scrubbing the stage selects the app */
initSmooth();
if(!RM){
  ScrollTrigger.create({trigger:'#stage',start:'top top',end:()=>'+='+innerHeight*APPS.length*.7,pin:true,scrub:true,onUpdate:s=>{
    gsap.set('#prog',{width:s.progress*100+'%'});
    if(s.progress>.01){auto=false;const i=Math.min(APPS.length-1,Math.floor(s.progress*APPS.length));if(i!==cur&&clouds.length)setTarget(i)}}});
  gsap.from('.tr',{y:50,opacity:0,duration:1,ease:'expo.out',stagger:.07,scrollTrigger:{trigger:'#rows',start:'top 80%'}});
  gsap.from('.cat h2',{y:60,opacity:0,duration:1.1,ease:'expo.out',scrollTrigger:{trigger:'.cat',start:'top 80%'}});
  gsap.from('.rules div',{y:50,opacity:0,duration:1,ease:'expo.out',stagger:.1,scrollTrigger:{trigger:'.rules',start:'top 85%'}});
}
</script>
</body>
</html>
